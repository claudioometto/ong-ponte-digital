# Integração contínua: todo pull request e todo push em develop e main
# gera o build de produção e roda a suíte inteira (rotas, teclado,
# formulário, temas, imagens e axe WCAG 2.1 AA) contra ele.
# O deploy fica com a Vercel: main -> produção, demais branches -> prévia.
name: Testes

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Build e testes
        run: npm test
        env:
          CI: true

      - name: Guardar o relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dos-testes
          path: test-results/
          retention-days: 7
